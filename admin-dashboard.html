<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hostel Name – Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Hostel Name</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="rooms.html">Rooms</a>
      <a href="admin.html">Admin</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="admin-wrapper">

    <!-- BOOKINGS SECTION -->
    <section class="admin-section">
      <h2>Bookings</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Guest</th>
            <th>Room / Bed</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
          <!-- Filled by adminDashboard.js -->
        </tbody>
      </table>
    </section>

    <!-- BLOCKED DATES SECTION -->
    <section class="admin-section">
      <h2>Blocked Dates</h2>

      <div class="block-form">
        <label>
          Room:
          <select id="blockRoom">
            <option value="">Select room</option>
            <option value="1">8-Bed Dorm</option>
            <option value="2">10-Bed Dorm</option>
            <option value="3">Single Room</option>
            <option value="4">Private Room</option>
          </select>
        </label>

        <label>
          Date:
          <input type="date" id="blockDate">
        </label>

        <button id="blockDateBtn">Block Date</button>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Room</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="blockedDatesBody">
          <!-- Filled by adminDashboard.js -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="adminDashboard.js"></script>
</body>
</html>
