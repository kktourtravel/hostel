<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Booking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Hostel Name</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="rooms.html">Rooms</a>
    <a href="booking.html">Booking</a>
    <a href="admin.html">Admin</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<section class="booking-section">

  <h2>Book Your Stay</h2>

  <!-- Step 1: Select Dates -->
  <div class="booking-wrapper">

    <div class="booking-group">
      <label>Check-in Date</label>
      <input type="date" id="checkin">
    </div>

    <div class="booking-group">
      <label>Check-out Date</label>
      <input type="date" id="checkout">
    </div>

    <button id="checkAvailabilityBtn">Check Availability</button>

  </div>

  <!-- Step 2: Available Beds -->
  <h3>Available Beds</h3>
  <div id="bedsContainer"></div>

  <!-- Step 3: Guest Details -->
  <h3>Guest Details</h3>

  <div class="booking-wrapper">

    <div class="booking-group">
      <label>Full Name</label>
      <input type="text" id="guestName">
    </div>

    <div class="booking-group">
      <label>Email</label>
      <input type="email" id="guestEmail">
    </div>

    <div class="booking-group">
      <label>Phone</label>
      <input type="text" id="guestPhone">
    </div>

    <div class="booking-group">
      <label>Country</label>
      <input type="text" id="guestCountry">
    </div>

  </div>

  <!-- Step 4: Summary -->
  <h3>Booking Summary</h3>

  <p id="summaryDates">Check-in: - | Check-out: -</p>
  <p id="summaryGuest">Guest: -</p>
  <p id="summaryBed">Selected Bed: -</p>

  <!-- Step 5: Confirm Booking -->
  <button id="confirmBookingBtn">Confirm Booking</button>

</section>

<script src="booking.js"></script>

</body>
</html>
