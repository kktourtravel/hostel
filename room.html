<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Room — Hostel Name</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .price-pill {
      display:inline-block;
      background:var(--accent-gold);
      color:var(--primary-teal);
      padding:10px 14px;
      border-radius:10px;
      font-weight:800;
      font-size:16px;
    }
    .availability-note { margin-top:12px; color:#7A8B82; }
    .calendar-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px; }
    .calendar-row input { padding:10px; border-radius:6px; border:1px solid #A3C4B8; background:var(--light-ivory); }
    .actions { margin-top:18px; display:flex; gap:12px; }
    .sold-out { background:#f5f5f5; color:#b33; padding:10px 14px; border-radius:8px; font-weight:700; }
  </style>
</head>
<body>

<header>
  <div class="logo">Hostel Name</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="rooms.html">Rooms</a>
    <a href="booking.html">Booking</a>
    <a href="admin.html">Admin</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<section>
  <div style="max-width:1000px;margin:40px auto;">
    <div id="hero" style="display:flex;gap:30px;flex-wrap:wrap;">
      <div style="flex:1;min-width:320px;">
        <img id="roomImage" src="" alt="room" style="width:100%;border-radius:10px;object-fit:cover;max-height:420px;">
      </div>

      <div style="flex:1;min-width:320px;">
        <h2 id="roomTitle">Room</h2>
        <p id="roomDesc" style="color:#4A6358;"></p>

        <div style="margin-top:12px;">
          <span class="price-pill" id="roomPrice">— BYN</span>
        </div>

        <div class="calendar-row">
          <label>Check-in <input type="date" id="checkin"></label>
          <label>Check-out <input type="date" id="checkout"></label>
          <label>Guests
            <select id="guests">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="checkAvailabilityBtn" style="background:var(--primary-teal);color:var(--light-ivory);padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;">Check Availability</button>
          <button id="sendRequestBtn" class="sold-out" style="display:none;">Send Request</button>
        </div>

        <p class="availability-note" id="availabilityNote"></p>
      </div>
    </div>

    <div id="moreInfo" style="margin-top:28px;">
      <h3>Amenities</h3>
      <ul id="amenitiesList" style="color:#4A6358;"></ul>
    </div>
  </div>
</section>

<footer class="footer-structured">
  <div class="footer-content">
    <div class="footer-left">
      <img src="footer-logo.png" alt="Hostel Logo" class="footer-logo">
      <p class="footer-email"><img src="email-icon.png" class="email-icon">info@hostelname.com</p>
    </div>
    <div class="footer-right">
      <h3>CONTACT NUMBERS</h3>
      <p><strong>Storozhovskaya Street, 8</strong><br>+375 44 560-91-46</p>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Hostel Name. All rights reserved.</div>
</footer>

<script>
const roomId = new URLSearchParams(window.location.search).get("room");
let selectedCheckin = null;
let selectedCheckout = null;

async function loadCalendar(month) {
    const res = await fetch(`/api/room/calendar?room=${roomId}&month=${month}`);
    const data = await res.json();

    data.days.forEach(day => {
        const el = document.querySelector(`[data-date="${day.date}"]`);
        if (!el) return;

        el.classList.remove("available-day", "disabled-day", "selected-day");

        if (day.status === "available") {
            el.classList.add("available-day");
        } else {
            el.classList.add("disabled-day");
        }

        el.onclick = () => selectDate(day.date, day.status);
    });
}

function selectDate(date, status) {
    if (status !== "available") return;

    if (!selectedCheckin) {
        selectedCheckin = date;
    } else if (!selectedCheckout) {
        if (date <= selectedCheckin) return;
        selectedCheckout = date;
    } else {
        selectedCheckin = date;
        selectedCheckout = null;
    }

    highlightSelection();
}

function highlightSelection() {
    document.querySelectorAll(".calendar-day").forEach(el => {
        el.classList.remove("selected-day");
    });

    if (!selectedCheckin) return;

    const start = selectedCheckin;
    const end = selectedCheckout || selectedCheckin;

    document.querySelectorAll(".calendar-day").forEach(el => {
        const d = el.dataset.date;
        if (d >= start && d <= end) {
            el.classList.add("selected-day");
        }
    });
}

function goToBooking() {
    if (!selectedCheckin || !selectedCheckout) {
        alert("Please select check-in and check-out dates.");
        return;
    }

    window.location.href =
        `booking.html?room=${roomId}&checkin=${selectedCheckin}&checkout=${selectedCheckout}`;
}

// Load current month
const today = new Date();
const month = today.toISOString().slice(0, 7);
loadCalendar(month);
</script>

</body>
</html>
