<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Room — Hostel Name</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .price-pill {
      display:inline-block;
      background:var(--accent-gold);
      color:var(--primary-teal);
      padding:10px 14px;
      border-radius:10px;
      font-weight:800;
      font-size:16px;
    }
    .availability-note { margin-top:12px; color:#7A8B82; }
    .calendar-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px; }
    .calendar-row input,
    .calendar-row select {
      padding:10px;
      border-radius:6px;
      border:1px solid #A3C4B8;
      background:var(--light-ivory);
    }
    .actions { margin-top:18px; display:flex; gap:12px; }
    .sold-out {
      background:#f5f5f5;
      color:#b33;
      padding:10px 14px;
      border-radius:8px;
      font-weight:700;
      border:none;
      cursor:pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Hostel Name</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="rooms.html">Rooms</a>
    <a href="booking.html">Booking</a>
    <a href="admin.html">Admin</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<section>
  <div style="max-width:1000px;margin:40px auto;">
    <div id="hero" style="display:flex;gap:30px;flex-wrap:wrap;">
      <div style="flex:1;min-width:320px;">
        <img id="roomImage" src="" alt="room" style="width:100%;border-radius:10px;object-fit:cover;max-height:420px;">
      </div>

      <div style="flex:1;min-width:320px;">
        <h2 id="roomTitle">Room</h2>
        <p id="roomDesc" style="color:#4A6358;"></p>

        <div style="margin-top:12px;">
          <span class="price-pill" id="roomPrice">— BYN</span>
        </div>

        <div class="calendar-row">
          <label>Check-in
            <input type="date" id="checkin">
          </label>
          <label>Check-out
            <input type="date" id="checkout">
          </label>
          <label>Guests
            <select id="guests">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="checkAvailabilityBtn"
                  style="background:var(--primary-teal);color:var(--light-ivory);padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;">
            Check Availability
          </button>
          <button id="sendRequestBtn" class="sold-out" style="display:none;">
            Send Request
          </button>
        </div>

        <p class="availability-note" id="availabilityNote"></p>
      </div>
    </div>

    <div id="moreInfo" style="margin-top:28px;">
      <h3>Amenities</h3>
      <ul id="amenitiesList" style="color:#4A6358;"></ul>
    </div>
  </div>
</section>

<footer class="footer-structured">
  <div class="footer-content">
    <div class="footer-left">
      <img src="footer-logo.png" alt="Hostel Logo" class="footer-logo">
      <p class="footer-email"><img src="email-icon.png" class="email-icon">info@hostelname.com</p>
    </div>
    <div class="footer-right">
      <h3>CONTACT NUMBERS</h3>
      <p><strong>Storozhovskaya Street, 8</strong><br>+375 44 560-91-46</p>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Hostel Name. All rights reserved.</div>
</footer>

<script>
const API_BASE = "https://hostelqhe0.onrender.com";
const roomId = new URLSearchParams(window.location.search).get("room");

// Map rooms.html → room.html details
const ROOM_CONFIG = {
  "8bed": {
    title: "8-Bed Mixed Dorm",
    desc: "Comfortable bunk beds, lockers, shared bathroom.",
    price: "45 BYN",
    image: "NAV03661.jpg",
    amenities: ["Wi-Fi", "Lockers", "Shared bathroom", "Linen"]
  },
  "10bed": {
    title: "10-Bed Mixed Dorm",
    desc: "Mixed dorm with cozy atmosphere.",
    price: "35 BYN",
    image: "10-dorms-room-athens-hawks.jpg",
    amenities: ["Wi-Fi", "Lockers", "Shared bathroom"]
  },
  "single": {
    title: "Single Bed Room",
    desc: "Perfect for solo travelers.",
    price: "55 BYN",
    image: "caption.jpg",
    amenities: ["Wi-Fi", "Private bathroom", "Linen"]
  },
  "private": {
    title: "Private Room",
    desc: "Perfect for couples or solo travelers.",
    price: "120 BYN",
    image: "The-Eden-Tampines-Pasir-Ris-Tampines-Singapore.jpg",
    amenities: ["Wi-Fi", "Private bathroom", "Linen"]
  }
};

let calendarDays = {}; // { "2026-08-18": "available" | "unavailable" | ... }

// Apply room details
function applyRoomDetails() {
  const cfg = ROOM_CONFIG[roomId];
  if (!cfg) return;

  document.getElementById("roomTitle").innerText = cfg.title;
  document.getElementById("roomDesc").innerText = cfg.desc;
  document.getElementById("roomPrice").innerText = cfg.price;
  document.getElementById("roomImage").src = cfg.image;

  const amenitiesList = document.getElementById("amenitiesList");
  amenitiesList.innerHTML = "";
  cfg.amenities.forEach(a => {
    const li = document.createElement("li");
    li.textContent = a;
    amenitiesList.appendChild(li);
  });
}

// Load calendar availability for current month
async function loadCalendar() {
  try {
    const today = new Date();
    const month = today.toISOString().slice(0, 7); // YYYY-MM
    const res = await fetch(`${API_BASE}/api/room/calendar?room=${roomId}&month=${month}`);
    const data = await res.json();

    calendarDays = {};
    if (data.days && Array.isArray(data.days)) {
      data.days.forEach(day => {
        calendarDays[day.date] = day.status; // date: "2026-08-18", status: "available" / "unavailable"
      });
    }
  } catch (e) {
    console.error("Failed to load calendar", e);
  }
}

function isDateAvailable(dateStr) {
  // If backend marks it as unavailable, block it
  if (calendarDays[dateStr] && calendarDays[dateStr] !== "available") {
    return false;
  }
  return true;
}

// Prevent past dates
function toYMD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function setupDateInputs() {
  const checkinInput = document.getElementById("checkin");
  const checkoutInput = document.getElementById("checkout");

  // Today (local)
  const today = new Date();
  const todayStr = toYMD(today);

  // Tomorrow (local)
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);
  const tomorrowStr = toYMD(tomorrow);

  // Block past dates
  checkinInput.min = todayStr;
  checkoutInput.min = tomorrowStr;

  // Auto‑fill initial values
  checkinInput.value = todayStr;
  checkoutInput.value = tomorrowStr;

  checkinInput.addEventListener("change", function () {
    const val = this.value;
    if (!val) return;

    if (!isDateAvailable(val)) {
      alert("Selected check‑in date is not available.");
      this.value = "";
      return;
    }

    const nextDay = new Date(val);
    nextDay.setDate(nextDay.getDate() + 1);
    const nextDayStr = toYMD(nextDay);

    checkoutInput.min = nextDayStr;
    if (checkoutInput.value < nextDayStr) {
      checkoutInput.value = "";
    }
  });

  checkoutInput.addEventListener("change", function () {
    const val = this.value;
    if (!val) return;

    if (!isDateAvailable(val)) {
      alert("Selected check‑out date is not available.");
      this.value = "";
      return;
    }
  });
}

// Check availability and either go to booking or show request
function setupActions() {
  const checkBtn = document.getElementById("checkAvailabilityBtn");
  const sendRequestBtn = document.getElementById("sendRequestBtn");
  const note = document.getElementById("availabilityNote");

  checkBtn.addEventListener("click", async () => {
    const checkin = document.getElementById("checkin").value;
    const checkout = document.getElementById("checkout").value;
    const guests = document.getElementById("guests").value;

    if (!checkin || !checkout) {
      alert("Please select both check-in and check-out dates.");
      return;
    }

    // Final guard: if any selected date is marked unavailable, block
    if (!isDateAvailable(checkin) || !isDateAvailable(checkout)) {
      note.innerText = "Selected dates are not available. Please choose different dates.";
      sendRequestBtn.style.display = "inline-block";
      return;
    }

    try {
      const res = await fetch(
  `${API_BASE}/api/room/availability?room=${roomId}&checkin=${checkin}&checkout=${checkout}&guests=${guests}`
);
      const data = await res.json();

      if (data.status === "available") {
        note.innerText = "Room is available for selected dates.";
        sendRequestBtn.style.display = "none";

        // Go to booking page with prefilled params
        window.location.href =
          `booking.html?room=${roomId}&checkin=${checkin}&checkout=${checkout}&guests=${guests}`;
      } else {
        note.innerText = "Room is not available for selected dates.";
        sendRequestBtn.style.display = "inline-block";
      }
    } catch (e) {
      console.error("Availability check failed", e);
      note.innerText = "Unable to check availability. Try again later.";
    }
  });

  sendRequestBtn.addEventListener("click", () => {
    alert("Please contact reception or send a manual request for these dates.");
  });
}

// Init
(async function initRoomPage() {
  applyRoomDetails();
  await loadCalendar();
  setupDateInputs();
  setupActions();
})();
</script>

</body>
</html>
