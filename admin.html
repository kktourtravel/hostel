<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-text="page_title_admin">Hostel Name – Admin</title>
<link rel="stylesheet" href="style.css?v=999">



</head>

<body class="admin-body">

<header>
  <div class="logo" data-text="logo_text">Hostel Name</div>
  <nav>
    <a href="index.html" data-text="nav_home">Home</a>
    <a href="rooms.html" data-text="nav_rooms">Rooms</a>
    <a href="booking.html" data-text="nav_booking">Booking</a>
    <a href="admin.html" data-text="nav_admin">Admin</a>
    <a href="contact.html" data-text="nav_contact">Contact Us</a>
  </nav>

  <div class="lang-switch">
    <span data-lang="en" class="active">EN</span>
    <span data-lang="ru">RU</span>
  </div>
</header>

<div class="admin-wrapper">

<section>
  <h2 data-text="admin_title">Admin Login</h2>

  <div class="booking-wrapper">

    <div class="booking-group">
      <label data-text="admin_email_label">Email</label>
      <input type="email" id="adminEmail">
    </div>

    <div class="booking-group">
      <label data-text="admin_password_label">Password</label>
      <input type="password" id="adminPassword">
    </div>

    <button onclick="alert('Connect to /api/admin/login')" data-text="admin_login_btn">Login</button>

  </div>
</section>

</div>

<footer class="footer-structured">
  <div class="footer-content">

    <div class="footer-left">
      <img src="footer-logo.png" alt="Hostel Logo" class="footer-logo">
      <p class="footer-email">
        <img src="email-icon.png" class="email-icon">
        <span data-text="footer_email">info@hostelname.com</span>
      </p>
    </div>

    <div class="footer-right">
      <h3 data-text="footer_contact_heading">CONTACT NUMBERS</h3>

      <p>
        <strong data-text="footer_addr1">Storozhovskaya Street, 8</strong><br>
        <span data-text="footer_phone1">+375 44 560-91-46</span>
      </p>

      <p>
        <strong data-text="footer_addr2">46 Independence Avenue</strong><br>
        <span data-text="footer_phone2">+375 29 322-60-91</span>
      </p>

      <p>
        <strong data-text="footer_addr3">Berestynskaya 12, Building 1</strong><br>
        <span data-text="footer_phone3">+375 44 533-33-15</span>
      </p>
    </div>

  </div>

  <div class="footer-bottom" data-text="footer_bottom">
    © 2026 Hostel Name. All rights reserved.
  </div>
</footer>

<script>
const translations = {
  en: {
    page_title_admin: "Hostel Name – Admin",
    logo_text: "Hostel Name",
    nav_home: "Home",
    nav_rooms: "Rooms",
    nav_booking: "Booking",
    nav_admin: "Admin",
    nav_contact: "Contact Us",

    admin_title: "Admin Login",
    admin_email_label: "Email",
    admin_password_label: "Password",
    admin_login_btn: "Login",

    footer_email: "info@hostelname.com",
    footer_contact_heading: "CONTACT NUMBERS",
    footer_addr1: "Storozhovskaya Street, 8",
    footer_phone1: "+375 44 560-91-46",
    footer_addr2: "46 Independence Avenue",
    footer_phone2: "+375 29 322-60-91",
    footer_addr3: "Berestynskaya 12, Building 1",
    footer_phone3: "+375 44 533-33-15",
    footer_bottom: "© 2026 Hostel Name. All rights reserved."
  },

  ru: {
    page_title_admin: "Hostel Name – Админ",
    logo_text: "Hostel Name",
    nav_home: "Главная",
    nav_rooms: "Комнаты",
    nav_booking: "Бронирование",
    nav_admin: "Админ",
    nav_contact: "Контакты",

    admin_title: "Вход администратора",
    admin_email_label: "Email",
    admin_password_label: "Пароль",
    admin_login_btn: "Войти",

    footer_email: "info@hostelname.com",
    footer_contact_heading: "КОНТАКТНЫЕ НОМЕРА",
    footer_addr1: "Улица Сторожовская, 8",
    footer_phone1: "+375 44 560-91-46",
    footer_addr2: "Проспект Независимости, 46",
    footer_phone2: "+375 29 322-60-91",
    footer_addr3: "Берестынская 12, корпус 1",
    footer_phone3: "+375 44 533-33-15",
    footer_bottom: "© 2026 Hostel Name. Все права защищены."
  }
};

function applyTranslation(lang) {
  document.querySelectorAll("[data-text]").forEach(el => {
    const key = el.getAttribute("data-text");
    if (translations[lang] && translations[lang][key]) {
      el.innerText = translations[lang][key];
    }
  });
}

document.querySelectorAll('.lang-switch span').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-switch span').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyTranslation(btn.dataset.lang);
  });
});
</script>

</body>
</html>
