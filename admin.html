<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard — Hostel Name</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:var(--light-ivory); }
  .admin-wrap { max-width:1100px;margin:40px auto;padding:20px;background:#fff;border-radius:10px;border:1px solid #C4DBD3; }
  table { width:100%;border-collapse:collapse;margin-top:20px; }
  th, td { padding:12px;border-bottom:1px solid #ddd;text-align:left; }
  th { background:var(--primary-teal);color:#fff; }
  .cancel-btn { background:#b33;color:#fff;padding:6px 10px;border:none;border-radius:6px;cursor:pointer; }
  .export-btn { background:var(--accent-gold);color:var(--primary-teal);padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer; }
  .filter-row { display:flex;gap:12px;margin-top:20px; }
  .filter-row input { padding:10px;border-radius:6px;border:1px solid #A3C4B8; }
</style>
</head>
<body>

<header>
  <div class="logo">Hostel Name</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="rooms.html">Rooms</a>
    <a href="booking.html">Booking</a>
    <a href="admin-dashboard.html">Admin</a>
  </nav>
</header>

<section>
  <div class="admin-wrap">
    <h2>Admin Booking Dashboard</h2>

    <div class="filter-row">
      <input type="date" id="filterFrom">
      <input type="date" id="filterTo">
      <input type="text" id="filterGuest" placeholder="Guest name">
      <button id="filterBtn" class="export-btn">Apply Filters</button>
      <button id="exportBtn" class="export-btn">Export Excel</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Guest</th>
          <th>Room</th>
          <th>Check-in</th>
          <th>Check-out</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="bookingTable"></tbody>
    </table>
  </div>
</section>

<script>
const API_BASE = "https://hostelbackend1.onrender.com";

async function loadBookings(){
  const from = document.getElementById("filterFrom").value;
  const to = document.getElementById("filterTo").value;
  const guest = document.getElementById("filterGuest").value;

  const res = await fetch(`${API_BASE}/api/admin/bookings?from=${from}&to=${to}&guest=${guest}`);
  const data = await res.json();

  const tbody = document.getElementById("bookingTable");
  tbody.innerHTML = "";

  data.bookings.forEach(b => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${b.id}</td>
      <td>${b.guest_name}</td>
      <td>${b.room_name}</td>
      <td>${b.checkin_date}</td>
      <td>${b.checkout_date}</td>
      <td>${b.status}</td>
      <td><button class="cancel-btn" onclick="cancelBooking(${b.id})">Cancel</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function cancelBooking(id){
  if (!confirm("Cancel this booking?")) return;
  await fetch(`${API_BASE}/api/admin/bookings/cancel`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ booking_id:id })
  });
  loadBookings();
}

document.getElementById("filterBtn").onclick = loadBookings;

document.getElementById("exportBtn").onclick = () => {
  window.location.href = `${API_BASE}/api/admin/export/excel`;
};

document.addEventListener("DOMContentLoaded", loadBookings);
</script>

</body>
</html>
