<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-text="page_title_admin">Hostel Name – Admin</title>
  <link rel="stylesheet" href="style.css?v=999">
</head>

<body class="admin-body">

<header>
  <div class="logo" data-text="logo_text">Hostel Name</div>
  <nav>
    <a href="index.html" data-text="nav_home">Home</a>
    <a href="rooms.html" data-text="nav_rooms">Rooms</a>
    <!-- Booking removed from navigation -->
    <a href="admin.html" data-text="nav_admin">Admin</a>
    <a href="contact.html" data-text="nav_contact">Contact Us</a>
  </nav>

  <div class="lang-switch">
    <span data-lang="en" class="active">EN</span>
    <span data-lang="ru">RU</span>
  </div>
</header>

<div class="admin-wrapper">

<section>
  <h2 data-text="admin_title">Admin Login</h2>

  <div class="booking-wrapper">

    <div class="booking-group">
      <label data-text="admin_email_label">Email</label>
      <input type="email" id="adminEmail" placeholder="Enter your email">
    </div>

    <div class="booking-group">
      <label data-text="admin_password_label">Password</label>
      <input type="password" id="adminPassword" placeholder="Enter your password">
    </div>

    <button id="adminLoginBtn" data-text="admin_login_btn">Login</button>

    <p id="adminLoginMessage" style="margin-top:12px;color:#b33;font-weight:600;"></p>

  </div>
</section>

</div>

<footer class="footer-structured">
  <div class="footer-content">

    <div class="footer-left">
      <img src="footer-logo.png" alt="Hostel Logo" class="footer-logo">
      <p class="footer-email">
        <img src="email-icon.png" class="email-icon">
        <span data-text="footer_email">info@hostelname.com</span>
      </p>
    </div>

    <div class="footer-right">
      <h3 data-text="footer_contact_heading">CONTACT NUMBERS</h3>

      <p>
        <strong data-text="footer_addr1">Storozhovskaya Street, 8</strong><br>
        <span data-text="footer_phone1">+375 44 560-91-46</span>
      </p>

      <p>
        <strong data-text="footer_addr2">46 Independence Avenue</strong><br>
        <span data-text="footer_phone2">+375 29 322-60-91</span>
      </p>

      <p>
        <strong data-text="footer_addr3">Berestynskaya 12, Building 1</strong><br>
        <span data-text="footer_phone3">+375 44 533-33-15</span>
      </p>
    </div>

  </div>

  <div class="footer-bottom" data-text="footer_bottom">
    © 2026 Hostel Name. All rights reserved.
  </div>
</footer>

<script src="auth-guard.js"></script>
<script>
const API_BASE = "https://hostel-qhe0.onrender.com";

// Clear old insecure auth data
function clearOldAuth() {
    localStorage.removeItem("isAdminLoggedIn");
    localStorage.removeItem("adminEmail");
}

// Prevent already logged in users from seeing login page
function checkAlreadyLoggedIn() {
    if (AuthGuard.isAuthenticated()) {
        window.location.href = "adminDashboard.html";
    }
}

// On page load, check if already logged in
window.addEventListener("DOMContentLoaded", () => {
    clearOldAuth();
    checkAlreadyLoggedIn();
});

document.getElementById("adminLoginBtn").addEventListener("click", async () => {
    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;
    const messageEl = document.getElementById("adminLoginMessage");
    const loginBtn = document.getElementById("adminLoginBtn");

    // Validation
    if (!email || !password) {
        messageEl.textContent = "Please enter both email and password";
        return;
    }

    // Disable button during request
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    messageEl.textContent = "";

    try {
        const res = await fetch(`${API_BASE}/api/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.status === "success" && data.token) {
            // Store JWT token securely
            localStorage.setItem("adminToken", data.token);
            localStorage.setItem("isAdminLoggedIn", "true");
            
            // Redirect to dashboard
            window.location.href = "adminDashboard.html";
        } else {
            messageEl.textContent = data.message || "Login failed. Please try again.";
            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }

    } catch (err) {
        console.error("Login error:", err);
        messageEl.textContent = "Server error. Please try again later.";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
});
</script>

</body>
</html>
